rollup_modes:
  CORE: initiative
  WEB: initiative
  DATA: initiative
  PLAT: fixVersion
  OPS: fixVersion

done_statuses:
  - Done
  - Closed
  - Resolved

resource_groups:
  CORE: Core Product Engineering
  WEB: Web Experience
  DATA: Data Engineering
  PLAT: Platform Engineering
  OPS: Operations

multi_fixversion_policy:
  default: reference
  OPS: split

metrics:
  hours_per_story_point: 8

columns:
  jira_key:
    - Issue key
    - Key
  issue_id:
    - Issue id
    - Issue ID
  issue_type:
    - Issue Type
    - Work Item Type
  summary:
    - Summary
    - Name
  epic_link:
    - Epic Link
  parent:
    - Parent
    - Parent key
  fix_versions:
    - Fix versions
    - Fix Version/s
  story_points:
    - Story Points
    - Story point estimate
  logged_hours:
    - Logged Hours
    - Time Spent
    - Worklog Hours
  status:
    - Status
  resolution:
    - Resolution
  resolved:
    - Resolved
  target_start:
    - Target start
  target_end:
    - Target end
  warning_suppression_date:
    - Created
    - Resolved
    - Warning suppression date
  predecessors:
    - Inward issue link (Blocks)
    - Blocked by
    - is blocked by
  successors:
    - Outward issue link (Blocks)
    - Blocks

behavior:
  unknown_prefix: exclude
  hide_completed_epics: true
  write_state_on_validate: false

warning_suppression:
  before: "2025-01-01"
  date_fields:
    - target_end
    - target_start
  severities:
    - Warning
    - Review
  keep_summary: true

# Completed fixVersion rollups are hidden from manager HTML reports only when
# every issue declaring that fixVersion is done, every issue has a usable
# Resolved date, and the latest Resolved date is more than this many days old.
# The hidden rollup is still retained in CSV audit output for traceability.
fixversion_completion_suppression:
  enabled: true
  stale_after_days: 90
  as_of_date: "2026-09-17"
  keep_audit_summary: true

planning_horizon:
  enabled: true
  immediate_months: 6
  bucket_months: 6
  as_of_date: "2026-09-17"

review_table:
  exposed_columns:
    - jira_key
    - summary
    - resource_group
    - dependency_review
    - jira_status
    - start
    - finish
    - percent_complete
    - predecessors
  include_audit_columns: false

project_fields:
  jira_key: Text1
  jira_issue_id: Text2
  jira_issue_type: Text3
  rollup_mode: Text4
  rollup_key: Text5
  jira_key_prefix: Text7
  dependency_review: Text8
  jira_status: Text9
  j2p_key: Text10
  row_role: Text11
  fix_version: Text12
  primary_schedule_key: Text13
  total_story_points: Number1
  completed_story_points: Number2
  logged_hours: Number3
  story_point_ratio: Number4
  in_planning: Flag1
  unmatched_project_task: Flag2
  dependency_review_needed: Flag3
  drives_schedule: Flag4
  jira_target_start: Date1
  jira_target_end: Date2
