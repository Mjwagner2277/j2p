rollup_modes:
  SSWUMS: initiative
  SSWSYS: initiative
  SSWCYBER: initiative
  SSWSW: fixVersion
  SSWHW: initiative
  SSWGUI: fixVersion
  SSWIF: fixVersion
  SSWNET: fixVersion
  SSWTEST: fixVersion

done_statuses:
  - Done
  - Closed
  - Resolved

resource_groups:
  SSWUMS: UMS
  SSWSYS: Systems
  SSWCYBER: Cyber
  SSWSW: Software
  SSWHW: Hardware
  SSWGUI: Software and Systems
  SSWIF: Interfaces
  SSWNET: Network Architecture
  SSWTEST: Test

multi_fixversion_policy:
  default: reference
  OPS: split

metrics:
  hours_per_story_point: 8
  logged_hours_units:
    # Jira's numeric Time Spent export is seconds; custom hour fields stay hours.
    Time Spent: seconds

columns:
  jira_key:
    - Issue key
    - Key
  issue_id:
    - Issue id
    - Issue ID
  issue_type:
    - Issue Type
    - Work Item Type
  summary:
    - Summary
    - Name
  epic_link:
    - Custom field (Epic Link)
  parent:
    - Custom field (Parent Link)
  fix_versions:
    - Fix versions
    - Fix Version/s
  story_points:
    - Custom field (Story Points)
    # Preserve the original-estimate fallback only when current points are blank.
    - Custom field (Original story points)
  logged_hours:
    - Custom field (Time Spent Total (hrs))
    - Time Spent
    - Worklog Hours
  status:
    - Status
  resolution:
    - Resolution
  resolved:
    - Resolved
  target_start:
    - Custom field (Target start)
  target_end:
    - Custom field (Target end)
  warning_suppression_date:
    - Created
    - Resolved
    - Warning suppression date
  predecessors:
    - Inward issue link (Blocks)

behavior:
  unknown_prefix: exclude
  hide_completed_epics: true
  write_state_on_validate: false

warning_suppression:
  before: "2026-03-30"
  date_fields:
    - target_end
    - target_start
  severities:
    - Warning
    - Review
  keep_summary: true

# Completed fixVersion rollups are hidden from manager HTML reports only when
# every issue declaring that fixVersion is done, every issue has a usable
# Resolved date, and the latest Resolved date is more than this many days old.
# The hidden rollup is still retained in CSV audit output for traceability.
fixversion_completion_suppression:
  enabled: true
  stale_after_days: 90
  as_of_date: "2026-09-17"
  keep_audit_summary: true

planning_horizon:
  enabled: true
  immediate_months: 6
  bucket_months: 6
  as_of_date: "2026-09-17"

review_table:
  exposed_columns:
    - jira_key
    - summary
    - resource_group
    - dependency_review
    - jira_status
    - start
    - finish
    - completion_percent
    - predecessors
  include_audit_columns: false

project_fields:
  jira_key: Text1
  jira_issue_id: Text2
  jira_issue_type: Text3
  rollup_mode: Text4
  rollup_key: Text5
  jira_key_prefix: Text7
  dependency_review: Text8
  jira_status: Text9
  j2p_key: Text10
  row_role: Text11
  fix_version: Text12
  primary_schedule_key: Text13
  total_story_points: Number1
  completed_story_points: Number2
  logged_hours: Number3
  story_point_ratio: Number4
  in_planning: Flag1
  unmatched_project_task: Flag2
  dependency_review_needed: Flag3
  drives_schedule: Flag4
  jira_target_start: Date1
  jira_target_end: Date2
